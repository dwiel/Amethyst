name: Tests

on:
  push:
    # `master` is this fork's only working branch (docs/local-dev.md: one working
    # line, no feature branches), so without it here the workflow never ran --
    # 0 Actions runs since it was added. `development` stays for upstream parity.
    branches: [ master, development ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and run unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Dependencies
        run: |
          brew bundle
      - name: Test
        run: |
          set -o pipefail && xcodebuild -workspace Amethyst.xcworkspace -scheme Amethyst clean test | xcbeautify

